<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hej Denmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Fraunces:opsz,wght@9..144,500..700&amp;display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#faf5e8;
  --band:#f2ebda;
  --surface:#fffcf6;
  --ink:#272018;
  --muted:#5a5143;
  --faint:#8a7f6c;
  --border:#d8d0bf;
  --line:#e6ddca;
  --green:#365a37;
  --green-hover:#2c4b2d;
  --green-deep:#2f4535;
  --on-green:#fbf8f0;
  --on-green-muted:#c6d1c1;
  --sage:#4a6e50;
  --green-soft:rgba(54,90,55,.12);
  --green-soft-2:rgba(54,90,55,.2);
  --chip:#ebe4d3;
  --chip-hover:#e2d9c5;
  --urgent:#864d2d;
  --urgent-soft:rgba(134,77,45,.14);
  --soon:#b9893f;
  --soon-text:#6f5122;
  --soon-soft:rgba(209,170,110,.24);
  --word-bg:rgba(209,170,110,.16);
  --word-border:#d1aa6e;
  --field:#ffffff;
  --tile-end:#87998d;
  --shadow-sm:0 1px 2px rgba(39,32,24,.05),0 4px 14px rgba(39,32,24,.05);
  --shadow-md:0 24px 48px -24px rgba(39,32,24,.35);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --header-h:68px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
svg.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
#main:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.container{width:100%;max-width:1160px;margin-inline:auto;padding-inline:24px}
@media (max-width:640px){.container{padding-inline:16px}}

/* Type */
.display{font-family:var(--serif);font-weight:600;font-size:clamp(58px,9.2vw,116px);line-height:.94;letter-spacing:-.03em}
.h1{font-family:var(--serif);font-weight:600;font-size:clamp(36px,4.8vw,54px);line-height:1.04;letter-spacing:-.02em;text-wrap:balance}
.h2{font-family:var(--serif);font-weight:600;font-size:clamp(30px,3.6vw,42px);line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
.h3{font-family:var(--serif);font-weight:600;font-size:clamp(22px,2.3vw,27px);line-height:1.18;letter-spacing:-.01em;text-wrap:balance}
.h4{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.25;letter-spacing:-.005em;text-wrap:balance}
.eyebrow{font-size:12.5px;line-height:1.3;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sage)}
.lead{font-size:clamp(18px,1.7vw,21px);line-height:1.5;color:var(--muted);max-width:52ch}
.muted{color:var(--muted)}
.small{font-size:15px;line-height:1.55}
.tiny{font-size:13.5px;line-height:1.45}
.strong{font-weight:600}
.accent{color:var(--green)}
.danger{color:var(--urgent)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.flex1{flex:1 1 0%}
.min0{min-width:0}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}.gap24{gap:24px}
.mt-auto{margin-top:auto}

/* Buttons, chips, badges */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--ink);font:600 15px/1.2 var(--sans);white-space:nowrap;text-decoration:none;transition:background-color .15s ease,border-color .15s ease,transform .12s ease,color .15s ease}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:default}
.btn-primary{background:var(--green);color:var(--on-green)}
.btn-primary:hover:not([disabled]){background:var(--green-hover)}
.btn-secondary{background:var(--chip);border-color:var(--border)}
.btn-secondary:hover:not([disabled]){background:var(--chip-hover)}
.btn-outline{background:var(--surface);border-color:var(--border)}
.btn-outline:hover:not([disabled]){border-color:var(--green)}
.btn-ghost:hover:not([disabled]){background:var(--green-soft)}
.btn-light{background:var(--on-green);color:var(--green-deep)}
.btn-light:hover{background:#fff}
.btn-lg{min-height:54px;padding:0 26px;font-size:16px}
.btn-sm{min-height:40px;padding:0 15px;font-size:14px}
.btn-icon{width:46px;min-width:46px;padding:0}
.btn-icon.btn-sm{width:40px;min-width:40px}
.btn-block{width:100%;white-space:normal;text-align:center}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:500 14px/1.2 var(--sans);white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.chip:hover:not([disabled]){border-color:var(--green)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.chip[disabled]{opacity:.5;cursor:default}
.chip .you{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;font:600 12.5px/1 var(--sans);white-space:nowrap;align-self:flex-start;flex:none}
.badge-urgent{background:var(--urgent-soft);color:var(--urgent)}
.badge-soon{background:var(--soon-soft);color:var(--soon-text)}
.badge-later{background:var(--chip);color:var(--muted)}
.badge-done{background:var(--green-soft);color:var(--green)}
.tag{display:inline-flex;align-items:center;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--green);color:var(--on-green);font:700 10.5px/1.6 var(--sans);letter-spacing:.06em;text-transform:uppercase;vertical-align:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:24px}
.card-sm{padding:18px 20px}
.icon-circle{width:48px;height:48px;border-radius:50%;background:var(--green-soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--green)}
.icon-circle.sm{width:40px;height:40px}
.bar{height:6px;background:var(--chip);border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s ease}
.input{width:100%;min-width:0;height:50px;border-radius:14px;border:1px solid var(--border);background:var(--field);padding:0 16px;font:400 16px/1.4 var(--sans);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--faint);opacity:1}
.input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.compose-row{display:flex;gap:10px;align-items:center}
.spinner{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--green-soft-2);border-top-color:var(--green);animation:spin .8s linear infinite;flex:none}
.spinner.sm{width:16px;height:16px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:var(--chip);position:relative;overflow:hidden;border-radius:10px}
.skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shimmer 1.2s ease-in-out infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.notice{display:flex;align-items:center;gap:10px;background:var(--green-soft);border:1px solid var(--green);border-radius:14px;padding:12px 16px;color:var(--green);font-weight:600;animation:fadein .2s ease both}
.notice.out{animation:fadeout .16s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes fadeout{to{opacity:0}}
.pop{display:inline-flex;animation:pop .2s ease both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* Header and footer */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(250,245,232,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.header-inner{height:var(--header-h);display:flex;align-items:center;gap:20px}
.brand{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.brand .hej{color:var(--green)}
.main-nav{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav-link{padding:9px 14px;border-radius:999px;font-size:15px;font-weight:500;color:var(--muted);transition:background-color .15s,color .15s}
.nav-link:hover{color:var(--ink);background:var(--green-soft)}
.nav-link[aria-current="page"]{color:var(--ink);background:var(--green-soft-2)}
.header-actions{display:flex;align-items:center;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green-soft-2);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.avatar.lg{width:64px;height:64px}
.profile-link{display:inline-flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:15px;font-weight:600}
.profile-link:hover,.profile-link[aria-current="page"]{border-color:var(--green)}
.menu-btn{display:none}
.mobile-menu{display:none;border-top:1px solid var(--line)}
.mobile-menu a{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;font-size:17px;font-weight:500;border-bottom:1px solid var(--line)}
.mobile-menu a:last-child{border-bottom:0}
.mobile-menu a[aria-current="page"]{color:var(--green);font-weight:700}
@media (max-width:900px){
  .main-nav{display:none}
  .header-actions{margin-left:auto}
  .hide-sm{display:none!important}
  .menu-btn{display:inline-flex}
  .profile-link{padding:3px}
  .site-header.open .mobile-menu{display:block}
}
.site-footer{background:var(--green-deep);color:var(--on-green);padding:56px 0 36px;border-top:1px solid rgba(255,255,255,.08)}
.footer-grid{display:grid;grid-template-columns:1.5fr repeat(3,minmax(0,1fr));gap:32px}
.footer-title{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b9ccb5;margin-bottom:12px}
.footer-links{display:flex;flex-direction:column;gap:8px}
.footer-links a{color:var(--on-green);opacity:.9;font-size:15px;display:inline}
.footer-links a svg.ic{display:inline-block;vertical-align:-2px;margin-left:5px}
.footer-links a:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
.footer-bottom{margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;color:var(--on-green-muted);font-size:13.5px}
.site-footer .brand{color:var(--on-green)}
.site-footer .brand .hej{color:#a9c4a3}
@media (max-width:860px){.footer-grid{grid-template-columns:1fr 1fr}.footer-grid>:first-child{grid-column:1/-1}}

/* Page scaffolding */
.site-main{min-height:calc(100vh - var(--header-h));min-height:calc(100dvh - var(--header-h))}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:44px 0 28px}
.page-head.compact{padding:32px 0 20px}
.page-pad{padding-bottom:72px}
.narrow{max-width:760px}
.back-link{display:inline-flex;align-items:center;gap:8px;margin:24px 0 16px;color:var(--green);font-weight:600}
.pill-link{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:15px;font-weight:500}
.pill-link:hover{border-color:var(--green)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 24px}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:center;padding-top:72px;padding-bottom:88px}
.hero-copy .display{margin-top:18px}
.hero-lead{margin-top:24px;max-width:30ch;font-size:clamp(20px,2vw,24px);color:var(--muted)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.hero-meta{display:flex;flex-wrap:wrap;gap:12px 24px;margin-top:26px;color:var(--muted);font-size:15px}
.hero-meta li{display:inline-flex;align-items:center;gap:8px}
.preview-wrap{position:relative;justify-self:end;width:100%;max-width:470px}
.preview-wrap::before{content:"";position:absolute;inset:18px -14px -14px 18px;background:var(--band);border:1px solid var(--line);border-radius:30px;transform:rotate(3deg)}
.preview{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:28px;box-shadow:var(--shadow-md)}
.preview-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.preview-step{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:15px}
.preview-step.done span.title{text-decoration:line-through;color:var(--faint)}
.section{padding:96px 0}
.band{background:var(--band)}
.section-intro{display:flex;flex-direction:column;gap:14px;max-width:720px}
.homework{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:64px;align-items:center}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.term{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-sm)}
.term h3{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.2;margin-bottom:6px}
.term p{font-size:14px;line-height:1.45;color:var(--muted)}
.term:nth-child(3n+1){transform:rotate(-1.3deg)}
.term:nth-child(3n+2){transform:rotate(.8deg) translateY(6px)}
.term:nth-child(3n){transform:rotate(-.5deg)}
.term.key{background:#e4eadc;border-color:#9cb197}
.term.key p{color:var(--green-deep);font-weight:600}
.term.warn{background:#f4e0d4;border-color:#cf9c80}
.term.warn p{color:var(--urgent);font-weight:600}
.features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:44px}
.feature{display:flex;flex-direction:column;gap:14px;padding:28px}
.feature .link{margin-top:auto;padding-top:6px}
.word-strip{display:flex;align-items:center;gap:20px;margin-top:20px;background:var(--word-bg);border-color:var(--word-border);flex-wrap:wrap}
.word-strip .flag{font-size:30px;line-height:1}
.steps-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:44px}
.step-card{display:flex;flex-direction:column;gap:12px}
.step-num{width:38px;height:38px;border-radius:50%;background:var(--green);color:var(--on-green);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:44px}
.stat{display:flex;flex-direction:column;gap:12px;padding:32px}
.stat-num{font-family:var(--serif);font-weight:600;font-size:clamp(64px,8vw,104px);line-height:1;letter-spacing:-.03em;color:var(--green-deep);font-variant-numeric:lining-nums}
.stat-cap{font-size:clamp(18px,1.6vw,20px);line-height:1.45}
.cta-band{background:var(--green-deep);color:var(--on-green);padding:80px 0}
.cta-band .eyebrow{color:#b9ccb5}
.cta-inner{display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap}
.cta-band .muted{color:var(--on-green-muted)}
@media (max-width:980px){
  .hero{grid-template-columns:1fr;padding-top:44px;padding-bottom:64px;gap:44px}
  .preview-wrap{justify-self:start}
  .homework{grid-template-columns:1fr;gap:40px}
}
@media (max-width:860px){.features{grid-template-columns:1fr}.steps-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.stats{grid-template-columns:1fr}.section{padding:64px 0}}
@media (max-width:560px){.terms{grid-template-columns:repeat(2,minmax(0,1fr))}.term{transform:none!important}.steps-row{grid-template-columns:1fr}.preview{padding:22px}.preview-wrap::before{display:none}}

/* Plan builder */
.onb{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:56px;align-items:start;padding-top:56px;padding-bottom:88px}
.checks{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.checks li{display:flex;align-items:center;gap:10px;font-weight:500}
.note{margin-top:24px;padding:12px 16px;border-radius:14px;background:var(--green-soft);color:var(--green-deep);font-weight:600}
.q-card{padding:32px}
.q-top{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.q-progress{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.q-progress span{height:6px;border-radius:999px;background:var(--line)}
.q-progress span.on{background:var(--green)}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}
.options.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.option{position:relative;display:flex;align-items:center;gap:14px;min-height:72px;padding:14px 18px;border-radius:18px;border:1px solid var(--border);background:var(--bg);text-align:left;font-weight:600;font-size:16px;line-height:1.3;transition:border-color .15s,background-color .15s,color .15s}
.option:hover{border-color:var(--green)}
.option[aria-checked="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.option[aria-checked="true"] .icon-circle{background:rgba(255,255,255,.16);color:var(--on-green)}
.option .check{margin-left:auto}
.options.compact{margin-top:0}
.options.compact .option{min-height:52px;padding:10px 16px;justify-content:space-between}
.center-page{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:60vh}
@media (max-width:900px){.onb{grid-template-columns:1fr;gap:28px;padding-top:32px;padding-bottom:64px}.q-card{padding:22px}}
@media (max-width:640px){.options,.options.three{grid-template-columns:1fr}}

/* Today */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;padding-bottom:88px}
.span-5{grid-column:span 5}.span-7{grid-column:span 7}.span-12{grid-column:1/-1}
.progress-card{display:flex;align-items:center;gap:26px;background:var(--green-soft);border-color:var(--green)}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring-prog{transition:stroke-dashoffset .6s cubic-bezier(.2,.7,.2,1)}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:-.02em}
.upnext{display:flex;flex-direction:column;gap:14px}
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mini-ev{display:flex;flex-direction:column;gap:10px;padding:20px;text-align:left;transition:border-color .15s,transform .15s}
.mini-ev:hover{border-color:var(--green);transform:translateY(-2px)}
.mini-ev .loc{display:flex;align-items:center;gap:6px;margin-top:auto;color:var(--muted);font-size:14px}
.word-card{background:var(--word-bg);border-color:var(--word-border);display:flex;flex-direction:column;gap:14px}
.say-pill{display:inline-flex;padding:4px 12px;border-radius:999px;background:rgba(250,245,232,.8);font-size:14px;color:var(--muted)}

.filter-bar{margin-bottom:24px}

.phase{background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden}

.phase-body{padding:0 10px 10px;display:flex;flex-direction:column;gap:2px}
.step-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;transition:background-color .15s}
.step-row:hover{background:var(--green-soft)}

.step-ico{width:24px;display:flex;justify-content:center;flex:none}
.step-title{font-weight:600;font-size:16px;line-height:1.35}
.step-title.done{color:var(--faint);text-decoration:line-through}

.detail-pane{position:sticky;top:calc(var(--header-h) + 20px + env(safe-area-inset-top,0px));max-height:calc(100vh - var(--header-h) - 40px);overflow:auto;border-radius:22px;scrollbar-width:thin}

.detail-section{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:20px}

.check-item{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:12px 16px;border-radius:14px;border:1px solid var(--border);background:var(--bg);text-align:left;font-size:15.5px;line-height:1.4;transition:border-color .15s}

.check-item[aria-checked="true"]{background:var(--green-soft)}
.office{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:16px;border:1px solid var(--border);background:var(--bg)}
.tip{display:flex;gap:14px;background:var(--green-soft);border-radius:16px;padding:18px}
@media (max-width:1000px){.journey{grid-template-columns:1fr}}
@media (max-width:640px){.detail{padding:22px}.detail-cols{grid-template-columns:1fr}.progress-mini{min-width:0;width:100%}}

.chat-log{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}

.chat-compose{border-top:1px solid var(--line);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}

.msg-user{justify-content:flex-end;padding-left:56px}

/* ---------- Storage: this device only, like the app's guest mode ---------- */
const mem = new Map();
const store = {
  get(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch {} return mem.has(k) ? mem.get(k) : null; },
  set(k, v) { mem.set(k, v); try { localStorage.setItem(k, v); } catch {} },
  del(k) { mem.delete(k); try { localStorage.removeItem(k); } catch {} }
};
const readJSON = (k, fb) => { const v = store.get(k); if (v == null) return fb; try { return JSON.parse(v); } catch { return fb; } };
const writeJSON = (k, v) => store.set(k, JSON.stringify(v));

function loadGuest() {
  const id = store.get(KEY.active);
  S.guestId = id || null;
  if (!id) { S.profile = null; S.plan = []; return; }
  const p = readJSON(KEY.profile(id), null);
  S.profile = p && typeof p === 'object' && p.move_reason ? {...p, arrival_date:p.arrival_date ?? null} : null;
  const d = readJSON(KEY.done(id), []);
  S.done = new Set(Array.isArray(d) ? d.filter(n => typeof n === 'number') : []);
  const c = readJSON(KEY.checklist(id), {});
  S.checklist = c && typeof c === 'object' && !Array.isArray(c) ? c : {};
  const r = readJSON(KEY.reminders(id), []);
  S.reminders = Array.isArray(r) ? r.filter(x => x && typeof x.stepId === 'number' && typeof x.remindAt === 'string') : [];
  const sv = readJSON(KEY.saved(id), []);
  S.saved = Array.isArray(sv) ? sv.filter(e => e && e.id && e.title && e.startsAt) : [];
  const h = readJSON(KEY.ask(id), []);
  S.askHistory = Array.isArray(h) ? h.filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.text === 'string') : [];
  buildPlan();
}
function createGuest() {
  let id = store.get(KEY.active);
  if (!id) { id = `${Date.now()}-${Math.random().toString(36).slice(2,10)}`; store.set(KEY.active, id); }
  loadGuest();
}
function leaveGuest() {
  store.del(KEY.active);
  Object.assign(S, {guestId:null, profile:null, done:new Set(), checklist:{}, reminders:[], saved:[], askHistory:[], plan:[], pe:null, ev:null, openPhases:null, phaseKey:null, selStep:null, onb:{i:0, draft:{}}});
}
const saveDone = () => writeJSON(KEY.done(S.guestId), [...S.done]);

/* ---------- Plan logic (mirrors the app) ---------- */
function appliesTo(step, p) {
  const a = step.applies_to;
  if (!a || Array.isArray(a) || typeof a !== 'object') return true;
  const vals = {move_reason:p.move_reason, residency_group:p.residency_group, city:p.city, has_cpr:p.has_cpr};
  return Object.entries(a).every(([k, arr]) => !Array.isArray(arr) || arr.includes(vals[k] ?? ''));
}
function planFor(profile, done) {
  const inPlan = STEPS.filter(s => appliesTo(s, profile));
  const ids = new Set(inPlan.map(s => s.id));
  // A prerequisite that isn't in your plan (for example CPR when you already have one) counts as done.
  return inPlan.map(s => {
    const unmet = s.requires.filter(r => ids.has(r) && !done.has(r));
    return {...s, completed:done.has(s.id), locked:unmet.length > 0, unmet};
  });
}
function buildPlan() { S.plan = S.profile ? planFor(S.profile, S.done) : []; }
const prio = s => URGENT.has(s.slug) ? 'Urgent' : SOON.has(s.slug) ? 'Soon' : 'Later';
const PRIO_RANK = {Urgent:0, Soon:1, Later:2};
function journeyPhases(steps) {
  const known = new Set(PHASES.flatMap(p => p.slugs));
  const out = PHASES.map(p => ({...p, steps:p.slugs.map(sl => steps.find(s => s.slug === sl)).filter(Boolean)})).filter(p => p.steps.length);
  const more = steps.filter(s => !known.has(s.slug));
  return more.length ? [...out, {id:'more', title:'More to explore', intro:'Other useful steps', slugs:[], steps:more}] : out;
}
function currentPhase(plan) { const ph = journeyPhases(plan); return ph.find(p => p.steps.some(s => !s.completed)) ?? ph[ph.length - 1] ?? null; }
function nextStep(plan) {
  return plan.map((step, index) => ({step, index})).filter(({step}) => !step.completed && !step.locked)
    .sort((a, b) => PRIO_RANK[prio(a.step)] - PRIO_RANK[prio(b.step)] || a.index - b.index)[0]?.step ?? null;
}

function dailyWord(d = new Date()) {
  const n = WORDS.length;
  return WORDS[((Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5) + 11) % n + n) % n];
}
function arrivalMessage(date, now = new Date()) {
  if (!date) return null;
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const t = new Date(`${date}T00:00:00`).getTime();
  if (!Number.isFinite(t)) return null;
  const days = Math.round((today - t) / 864e5);
  if (days >= 0) return `Day ${days + 1} in Denmark`;
  const a = Math.abs(days);
  return `Arriving in ${a} ${a === 1 ? 'day' : 'days'}`;
}

function fmtTime(d) { const x = new Date(d); if (x.getHours() === 0 && x.getMinutes() === 0) return 'Time on event page'; return x.toLocaleTimeString('en-DK', {hour:'2-digit', minute:'2-digit'}); }
function fallbackEvents(city) {
  const label = city === 'other' ? 'Denmark' : (CITY_LABELS[city] || 'Denmark');
  const url = city === 'other' ? 'https://www.visitdenmark.com/denmark/things-do/events' : 'https://www.kultunaut.dk/UK/';
  const ideas = [['Friday community dinner','food',2,18],['City highlights walking tour','culture',3,11],['International meetup','social',4,19],['Weekend flea market','food',6,10],['Live music night','music',7,20],['Harbour walk','outdoors',8,13],['Danish conversation café','learning',10,17],['Museum evening','culture',12,18],['Sunday social run','sport',14,10],['Family creative workshop','family',16,12]];
  return ideas.map(([title, category, days, hour], i) => {
    const d = new Date(); d.setDate(d.getDate() + days); d.setHours(hour, 0, 0, 0);
    const startsAt = d.toISOString();
    return {id:`fallback-${city}-${i}`, title, startsAt, endsAt:null, dateLabel:fmtDay(startsAt), timeLabel:fmtTime(startsAt), location:label, category, sourceUrl:url, sourceName:city === 'other' ? 'VisitDenmark' : 'KultuNaut', isFallback:true};
  });
}
function cityEvents(city) {
  if (city === 'other' || !EVENT_SNAPSHOT[city]) return {events:fallbackEvents(city), usingFallback:true};
  const now = Date.now();
  const list = EVENT_SNAPSHOT[city].map(([id, title, startsAt, dateLabel, timeLabel, location, category]) => ({id:'kultunaut-' + id, title, startsAt, endsAt:null, dateLabel, timeLabel, location, category, sourceUrl:KN + id, sourceName:'KultuNaut', isFallback:false}))
    .filter(e => Date.parse(e.startsAt) >= now).sort((a, b) => Date.parse(a.startsAt) - Date.parse(b.startsAt));
  return list.length ? {events:list, usingFallback:false} : {events:fallbackEvents(city), usingFallback:true};
}
function whenMatch(e, when) {
  if (when === 'all') return true;
  const s = new Date(e.startsAt), now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  if (when === 'today') return s >= today && s < tomorrow;
  if (when === 'week') return s >= today && s < new Date(today.getTime() + 6048e5);
  const sat = new Date(today); sat.setDate(sat.getDate() + (6 - now.getDay() + 7) % 7);
  const mon = new Date(sat); mon.setDate(mon.getDate() + 2);
  return s >= sat && s < mon;
}

}

function inlineMD(s) {
  return s.split(/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:\/\/[^)\s]+\)|\*[^*\n]+\*)/g).filter(Boolean).map(part => {
    if (part.length > 4 && part.startsWith('**') && part.endsWith('**')) return `<strong>${esc(part.slice(2, -2))}</strong>`;
    if (part.length > 2 && part.startsWith('`') && part.endsWith('`')) return `<code>${esc(part.slice(1, -1))}</code>`;
    const l = part.match(/^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/);
    if (l) return isOfficial(l[2]) ? `<a href="${esc(l[2])}" ${ext}>${esc(l[1])}</a>` : esc(l[1]);
    if (part.length > 2 && part.startsWith('*') && part.endsWith('*')) return `<em>${esc(part.slice(1, -1))}</em>`;
    return esc(part);
  }).join('');
}
function md(text) {
  const blocks = []; let para = [];
  const flush = () => { if (para.length) { blocks.push({type:'p', text:para.join(' ')}); para = []; } };
  for (const raw of String(text).replace(/\r\n?/g, '\n').split('\n')) {
    const line = raw.trim();
    if (!line) { flush(); continue; }
    const m = line.match(/^(?:(\d+)[.)]|[-*•])\s+(.+)$/);
    if (m) { flush(); blocks.push({type:'li', ordered:Boolean(m[1]), index:m[1] ? Number(m[1]) : 0, text:m[2]}); }
    else para.push(line.replace(/^#{1,6}\s+/, ''));
  }
  flush();
  return blocks.map(b => b.type === 'li' ? `<div class="md-li"><span class="md-bullet">${b.ordered ? b.index + '.' : '•'}</span><span class="min0 flex1">${inlineMD(b.text)}</span></div>` : `<p>${inlineMD(b.text)}</p>`).join('');
}

function botMsg(m) {

}

/* ---------- Routing ---------- */
const APP_ONLY = ['today','journey','ask','profile'];
const routeKey = r => r.name === 'step' ? 'step-' + r.id : r.name;

}
function resolveRoute(r) {

}

}
function go(name, extra = {}, opts = {}) {

  if (r.name !== 'start') S.gateNote = S.route.name === 'start' ? null : S.gateNote;
  S.route = r;
  if (r.name !== 'step') S.stepError = null;
  setHash(r, opts.replace);
  render();
  const keep = r.name === 'step' && isWide() && (prev.name === 'journey' || prev.name === 'step');
  if (!keep) {

  }
}
window.addEventListener('popstate', () => {

  S.route = r; render();
  window.scrollTo(0, S.scroll[routeKey(r)] || 0);
});
const mq = window.matchMedia('(min-width: 1001px)');
const onMQ = () => { if (['journey','step','ask'].includes(S.route.name)) render(); };
if (mq.addEventListener) mq.addEventListener('change', onMQ); else if (mq.addListener) mq.addListener(onMQ);

/* ---------- Render ---------- */
const root = document.getElementById('app');
function render() {
  const r = S.route;

  switch (r.name) {
    case 'home': page = pageHome(); break;
    case 'start': page = pageStart(); break;
    case 'saving': page = pageSaving(); break;
    case 'login': page = pageLogin(); break;
    case 'today': page = pageToday(); break;
    case 'journey': page = pageJourney(null); break;
    case 'step': page = isWide() ? pageJourney(r.id) : pageStep(r.id); break;
    case 'ask': page = pageAsk(); break;
    case 'events': page = pageEvents(); break;
    case 'profile': page = pageProfile(); break;

  }
  root.innerHTML = header() + `<main id="main" class="site-main" tabindex="-1">${page}</main>` + footer();
  const prog = root.querySelector('.ring-prog');
  if (prog) {
    const to = prog.dataset.to;

}
function refreshEvents() {
  S.ev = {...S.ev, loading:true}; render();
  setTimeout(() => { if (S.ev) { S.ev = {...S.ev, loading:false}; if (S.route.name === 'events') render(); } }, 450);
}
const actions = {
  go: el => go(el.dataset.to),
  menu: el => {
    const h = document.getElementById('site-header'), open = !h.classList.contains('open');
    h.classList.toggle('open', open);
    el.setAttribute('aria-expanded', String(open));
    el.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    el.innerHTML = icon(open ? 'X' : 'Menu', 20);
  },
  'onb-back': () => { if (S.onb.i > 0) { S.onb.i -= 1; render(); } else go('home'); },
  opt: el => {
    const name = el.dataset.name, value = el.dataset.value;
    if (name === 'onb') {
      const q = QUESTIONS[S.onb.i];
      S.onb.draft = {...S.onb.draft, [q.key]:q.key === 'hasCpr' ? value === 'yes' : value};
      if (S.onb.i < QUESTIONS.length - 1) { S.onb.i += 1; render(); return; }
      finishOnboarding();
      return;
    }
    if (name.startsWith('pe-') && S.pe) {
      const k = name.slice(3);
      S.pe = {...S.pe, [k]:k === 'hasCpr' ? value === 'yes' : value};
      render();
    }
  },
  step: el => go('step', {id:Number(el.dataset.id)}),
  'today-done': el => {
    const id = Number(el.dataset.id), cur = currentPhase(S.plan);
    const phaseDone = cur && cur.steps.filter(s => !s.completed).length === 1 && cur.steps.some(s => s.id === id);
    S.todayError = null;
    if (!toggleStep(id)) { S.todayError = 'Couldn’t mark this step done. Try again.'; render(); return; }
    showToast('today', phaseDone ? `${cur.title} complete` : 'Step complete', phaseDone ? 'sparkles' : 'check', 2400);
    render();
  },
  'step-toggle': el => {
    const id = Number(el.dataset.id), st = S.plan.find(s => s.id === id);
    if (!st || (st.locked && !st.completed)) return;
    let msg = null;
    if (!st.completed) {
      const phase = journeyPhases(S.plan).find(ph => ph.steps.some(s => s.id === id));
      const lastInPhase = phase && phase.steps.filter(s => !s.completed).length === 1;
      const unlocked = S.plan.filter(s => s.locked && s.requires.includes(id) && s.unmet.length === 1);
      msg = unlocked.length ? `Unlocked: ${unlocked.map(s => s.title).join(', ')}` : lastInPhase ? `${phase.title} complete` : 'Step complete';
    }
    S.stepError = null;
    toggleStep(id);
    if (msg) showToast('step', msg, msg.startsWith('Unlocked') ? 'sparkles' : 'check', 2800);
    render();
  },
  check: el => {
    const id = el.dataset.id, item = el.dataset.item;
    const cur = new Set(S.checklist[id] || []);
    if (cur.has(item)) cur.delete(item); else cur.add(item);
    S.checklist = {...S.checklist, [id]:[...cur]};
    writeJSON(KEY.checklist(S.guestId), S.checklist);
    render();
  },
  remind: el => {
    const id = Number(el.dataset.id), d = new Date();
    d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0);
    S.reminders = [...S.reminders.filter(r => r.stepId !== id), {stepId:id, remindAt:d.toISOString(), notificationId:null}].sort((a, b) => Date.parse(a.remindAt) - Date.parse(b.remindAt));
    writeJSON(KEY.reminders(S.guestId), S.reminders);
    showToast('step', 'Added to your reminders on Today', 'check', 2600);
    render();
  },
  'ask-step': el => {
    const st = S.plan.find(s => s.id === Number(el.dataset.id));
    if (!st) return;
    go('ask');
    sendQuestion(`Help me with this Journey step: ${st.title}. ${st.description}`);
  },
  phase: el => {
    const id = el.dataset.id;
    if (S.openPhases.has(id)) S.openPhases.delete(id); else S.openPhases.add(id);
    const open = S.openPhases.has(id);
    el.setAttribute('aria-expanded', String(open));
    const panel = document.getElementById('ph-' + id);
    if (panel) panel.hidden = !open;
  },
  'jf-all': () => { S.jf = {urgent:false, hideDone:false}; render(); },
  'jf-urgent': () => { S.jf = {...S.jf, urgent:!S.jf.urgent}; render(); },
  'jf-hide': () => { S.jf = {...S.jf, hideDone:!S.jf.hideDone}; render(); },
  'refresh-plan': () => { buildPlan(); render(); },
  'ask-chip': el => { const q = el.dataset.q; if (S.route.name !== 'ask') go('ask'); sendQuestion(q); },
  'ask-retry': () => { if (S.ask.error) sendQuestion(S.ask.error, false); },
  'ev-city': el => { S.ev = {...S.ev, city:el.dataset.id, cat:'all', notice:null}; refreshEvents(); },
  'ev-when': el => { S.ev = {...S.ev, when:el.dataset.id}; render(); },
  'ev-all': () => { S.ev = {...S.ev, savedOnly:false}; render(); },
  'ev-saved': () => { S.ev = {...S.ev, savedOnly:true, cat:'all'}; render(); },
  'ev-cat': el => { S.ev = {...S.ev, cat:S.ev.cat === el.dataset.id ? 'all' : el.dataset.id}; render(); },
  'ev-clear': () => { S.ev = {...S.ev, when:'all', cat:'all', savedOnly:false}; render(); },
  'ev-refresh': () => { S.ev = {...S.ev, notice:null}; refreshEvents(); },
  'ev-save': el => {
    if (!S.guestId || !S.profile) { evNotice('Build your plan first to save events. It takes four quick questions.'); return; }
    const id = el.dataset.id, isSaved = S.saved.some(e => e.id === id);
    if (isSaved) S.saved = S.saved.filter(e => e.id !== id);
    else { const e = cityEvents(S.ev.city).events.find(x => x.id === id); if (e) S.saved = [e, ...S.saved]; }
    writeJSON(KEY.saved(S.guestId), S.saved);
    render();
  },
  'ev-cal': () => evNotice('Opened in Google Calendar.'),
  'ev-share': async el => {
    const id = el.dataset.id;
    const e = [...cityEvents(S.ev.city).events, ...S.saved].find(x => x.id === id);
    if (!e) return;
    const text = `${e.title}\n${e.dateLabel} · ${e.timeLabel}\n${e.location}\n${e.sourceUrl}`;
    try { await navigator.clipboard.writeText(text); evNotice('Event details copied. Paste them anywhere to share.'); }
    catch { evNotice('Copying isn’t available here. Open Details to share the event page.'); }
  },
  'pe-start': () => { const p = S.profile; S.pe = {moveReason:p.move_reason, residencyGroup:p.residency_group, city:p.city, hasCpr:p.has_cpr, arrivalDate:p.arrival_date}; S.peError = null; render(); },
  'pe-cancel': () => { S.pe = null; S.peError = null; render(); },
  'pe-noarrival': () => { if (S.pe) { S.pe = {...S.pe, arrivalDate:null}; render(); } },
  'pe-save': () => {
    const e = S.pe;
    if (!e || !(e.moveReason && e.residencyGroup && e.city && typeof e.hasCpr === 'boolean')) return;
    S.profile = {move_reason:e.moveReason, residency_group:e.residencyGroup, city:e.city, has_cpr:e.hasCpr, arrival_date:e.arrivalDate || null, onboarding_completed:true};
    writeJSON(KEY.profile(S.guestId), S.profile);
    S.pe = null; S.peError = null; S.ev = null;
    afterProfileChange(); render();
  },
  leave: () => { leaveGuest(); go('home', {}, {replace:true}); }
};

root.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !root.contains(el) || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  const href = el.getAttribute('href');
  if (el.tagName !== 'A' || (href && href.startsWith('#'))) e.preventDefault();
  if (el.dataset.act !== 'menu') document.getElementById('site-header')?.classList.remove('open');
  fn(el, e);
});
root.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ask-input') {
    S.ask.input = t.value;
    const btn = document.getElementById('ask-send');
    if (btn) btn.disabled = !(t.value.trim() && !S.ask.pending);
  } else if (t.id === 'today-ask') {
    S.todayAsk = t.value;
    const btn = document.getElementById('today-ask-send');
    if (btn) btn.disabled = !t.value.trim();
  }
});
root.addEventListener('change', e => {
  if (e.target.id === 'arrival-date' && S.pe) { S.pe = {...S.pe, arrivalDate:e.target.value || null}; render(); }
});
root.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'ask') { const v = S.ask.input; if (v.trim()) sendQuestion(v); }
  if (f === 'today-ask') { const v = S.todayAsk.trim(); if (!v) return; S.todayAsk = ''; go('ask'); sendQuestion(v); }
});

/* ---------- Start ---------- */
loadGuest();
S.route = resolveRoute(parseHash());
setHash(S.route, true);
render();
getSample();
})();
</script>

</body></html>
